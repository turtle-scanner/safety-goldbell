<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔔 서울지역 직업계고 안전골든벨 퀴즈앱</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --gold: #f59e0b;
      --gold-light: #fbbf24;
      --blue: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --purple: #8b5cf6;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app-container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #334155;
      position: relative;
    }
    .sound-toggle {
      position: absolute;
      top: 18px;
      right: 20px;
      background: #334155;
      border: 1px solid #475569;
      color: var(--gold);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sound-toggle:hover { background: #475569; }
    .header {
      text-align: center;
      margin-bottom: 20px;
      margin-top: 10px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .badge-admin { background: rgba(139, 92, 246, 0.25); color: #c4b5fd; border: 1px solid #8b5cf6; }
    .badge-user { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid #3b82f6; }
    .badge-stage1 { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
    .badge-stage2 { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-stage3 { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .title {
      font-size: 22px;
      font-weight: 800;
      color: var(--gold-light);
    }
    
    /* Login Screen */
    .login-box {
      text-align: center;
      padding: 10px 0;
    }
    .login-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .login-desc {
      color: var(--text-dim);
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .login-input {
      width: 100%;
      background: #0f172a;
      border: 2px solid #475569;
      color: var(--text);

    .login-input:focus {

    }
    .start-btn {

      background: linear-gradient(135deg, var(--gold), #d97706);

      padding: 16px;

      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
      transition: transform 0.15s;
    }
    .start-btn:hover {
      transform: translateY(-2px);
    }

    /* Progress Bar */
    .progress-bar-container {
      background: #334155;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      margin: 16px 0;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--green));
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Question Screen */

      background: #0f172a;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

      font-weight: 700;

      line-height: 1.5;
      font-weight: 600;
      word-break: keep-all;
    }
    
    /* Choice Buttons */
    .btn-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }
    .ox-grid {
      grid-template-columns: 1fr 1fr;
    }
    .choice-btn {
      background: #334155;
      color: var(--text);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;

      text-align: left;
    }
    .choice-btn:hover {
      background: #475569;
      transform: translateY(-2px);
    }
    .ox-btn {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      padding: 20px;

    .btn-x { color: #f87171; border-color: rgba(248, 113, 113, 0.4); }

      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .text-input {
      flex: 1;
      background: #0f172a;
      border: 2px solid #475569;
      color: var(--text);
      padding: 14px 16px;
      font-size: 16px;
      border-radius: 12px;
      outline: none;

    .text-input:focus {

      background: var(--gold);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Feedback */
    .feedback-box {
      display: none;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 15px;
      line-height: 1.5;

      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;

    .restart-btn {

      font-size: 16px;
      font-weight: 800;

      font-weight: 800;

    .answer-item {

      font-size: 14px;

      margin-top: 4px;

    }
    .admin-btn {

      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .btn-test { background: var(--blue); color: white; }
    .btn-logout { background: #475569; color: white; }
  </style>
</head>

<script>
// Web Audio API Sound Synthesizer (무설치 실시간 사운드 재생)
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-btn');
  if (soundEnabled) {
    btn.innerText = "🔊 사운드 ON";
    btn.style.color = "var(--gold)";
    playCorrectSound();
  } else {
    btn.innerText = "🔇 사운드 OFF";
    btn.style.color = "var(--text-dim)";
  }
}

// 1. 맞출 때: 경쾌하고 신나는 골든벨 딩동댕 멜로디 (도-미-솔-높은도)
function playCorrectSound() {
  if (!soundEnabled) return;
  initAudio();

  const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
  notes.forEach((freq, idx) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.1));

    gain.gain.setValueAtTime(0, audioCtx.currentTime + (idx * 0.1));
    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + (idx * 0.1) + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (idx * 0.1) + 0.35);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(audioCtx.currentTime + (idx * 0.1));
    osc.stop(audioCtx.currentTime + (idx * 0.1) + 0.4);
  });
}

// 2. 틀릴 때: 우당탕탕 접시/유리 깨지는 파열음 (Glass Shatter Crash)
function playWrongSound() {
  if (!soundEnabled) return;
  initAudio();

  const now = audioCtx.currentTime;

  // A. 금속/유리 깨지는 고주파 불협화음
  [2400, 3100, 4800, 6200].forEach((freq) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.4, now + 0.35);

    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.4);
  });

  // B. 와장창 파편 튀는 화이트 노이즈
  const bufferSize = audioCtx.sampleRate * 0.4;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.setValueAtTime(1500, now);

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.4, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

  noise.connect(filter);
  filter.connect(noiseGain);
  noiseGain.connect(audioCtx.destination);

  noise.start(now);
  noise.stop(now + 0.45);
}

  {

    choices: ["KOSHA", "ISO", "MSDS", "OSHA"],

  {

    choices: ["A급 화재", "B급 화재", "C급 화재", "K급 화재"],
    answer: 3,
    exp: "주방 화재는 Kitchen의 앞 글자를 딴 K급 화재입니다. (A급:일반, B급:유류·가스, C급:전기)"
  },
  {

    answers: ["중대재해처벌법", "중대재해 처벌법", "중대재해처벌 등에 관한 법률"],

let currentUser = { id: "", name: "", isAdmin: false };
let currentIdx = 0;
let score = 0;
let answered = false;

function startQuiz() {
  initAudio();
  const idInput = document.getElementById('user-id').value.trim();
  const nameInput = document.getElementById('user-name').value.trim();

  if (!idInput || !nameInput) {
    alert("학번과 이름(또는 암호)을 입력해주세요!");
    return;
  }

  // 관리자 인증 체크 (학번: 2500, 암호: cntfed)
  if (idInput === "2500" && nameInput === "cntfed") {
    currentUser.id = "2500";
    currentUser.name = "변귀섭 관리자";
    currentUser.isAdmin = true;
    showAdminDashboard();
    return;
  }

  // 일반 학생 로그인
  currentUser.id = idInput;
  currentUser.name = nameInput;
  currentUser.isAdmin = false;

  document.getElementById('login-area').style.display = 'none';
  document.getElementById('main-area').style.display = 'block';
  document.getElementById('user-display-badge').innerText = `도전자: ${currentUser.name} (${currentUser.id})`;

  initQuiz();
}

function showAdminDashboard() {
  document.getElementById('login-area').style.display = 'none';
  document.getElementById('admin-area').style.display = 'block';

  const list = document.getElementById('admin-answers-list');
  list.innerHTML = '';

  quizData.forEach((q, idx) => {
    const item = document.createElement('div');
    item.className = 'answer-item';
    let correctStr = "";
    if (q.type === 'ox') correctStr = q.answer;
    else if (q.type === 'choice') correctStr = `${q.answer + 1}번 (${q.choices[q.answer]})`;
    else correctStr = q.answers[0];

    item.innerHTML = `
      <div><b>Q${idx + 1}.</b> ${q.q}</div>
      <div class="ans-badge">정답: ${correctStr}</div>
      <div style="color:#94a3b8; font-size:12px; margin-top:4px;">해설: ${q.exp}</div>
    `;
    list.appendChild(item);
  });
}

function enterQuizAsAdmin() {
  document.getElementById('admin-area').style.display = 'none';
  document.getElementById('main-area').style.display = 'block';
  document.getElementById('user-display-badge').className = 'badge badge-admin';
  document.getElementById('user-display-badge').innerText = `👑 관리자: 변귀섭 (2500)`;
  initQuiz();
}

function logoutAdmin() {
  currentUser = { id: "", name: "", isAdmin: false };
  document.getElementById('user-id').value = '';
  document.getElementById('user-name').value = '';
  document.getElementById('admin-area').style.display = 'none';
  document.getElementById('main-area').style.display = 'none';
  document.getElementById('login-area').style.display = 'block';
}

function initQuiz() {
  currentIdx = 0;
  score = 0;
  answered = false;
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('result-area').style.display = 'none';
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = quizData[currentIdx];
  
  // Progress Bar
  const progressPercent = ((currentIdx) / quizData.length) * 100;
  document.getElementById('progress-bar').style.width = progressPercent + '%';

  // Badge & Stage Update
  const badge = document.getElementById('stage-badge');
  if (q.stage === 1) {
    badge.className = 'badge badge-stage1';
    badge.innerText = '1단계: 예선전 (O / X 퀴즈)';
  } else if (q.stage === 2) {
    badge.className = 'badge badge-stage2';
    badge.innerText = '2단계: 본선전 (4지선다 객관식)';
  } else {
    badge.className = 'badge badge-stage3';
    badge.innerText = '3단계: 결선전 (주관식 골든벨)';
  }

  // Question Info
  document.getElementById('q-number').innerText = `문제 ${currentIdx + 1} / ${quizData.length}`;
  document.getElementById('q-text').innerText = q.q;

  // Reset Feedback & Next Button
  document.getElementById('feedback-box').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';

  // Render Answers Area
  const container = document.getElementById('answers-container');
  container.innerHTML = '';

  if (q.type === 'ox') {
    const grid = document.createElement('div');
    grid.className = 'btn-grid ox-grid';
    grid.innerHTML = `
      <button class="choice-btn ox-btn btn-o" onclick="checkAnswer('O')">⭕ O</button>
      <button class="choice-btn ox-btn btn-x" onclick="checkAnswer('X')">❌ X</button>
    `;
    container.appendChild(grid);
  } else if (q.type === 'choice') {
    const grid = document.createElement('div');
    grid.className = 'btn-grid';
    q.choices.forEach((choice, idx) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<b>${idx + 1}.</b> ${choice}`;
      btn.onclick = () => checkAnswer(idx);
      grid.appendChild(btn);
    });
    container.appendChild(grid);
  } else if (q.type === 'text') {
    const group = document.createElement('div');
    group.className = 'input-group';
    group.innerHTML = `
      <input type="text" id="text-ans" class="text-input" placeholder="정답을 입력하세요 (예: MSDS)" autofocus onkeypress="if(event.keyCode==13) submitTextAnswer()">
      <button class="submit-btn" onclick="submitTextAnswer()">정답 제출</button>
    `;
    container.appendChild(group);
    setTimeout(() => document.getElementById('text-ans').focus(), 100);
  }
}

function submitTextAnswer() {
  if (answered) return;
  const input = document.getElementById('text-ans');
  const val = input.value.trim();
  if (!val) {
    alert('정답을 입력해주세요!');
    return;
  }
  checkAnswer(val);
}

function checkAnswer(userAns) {
  if (answered) return;
  answered = true;
  const q = quizData[currentIdx];
  let isCorrect = false;

  if (q.type === 'ox') {
    isCorrect = (userAns === q.answer);
  } else if (q.type === 'choice') {
    isCorrect = (userAns === q.answer);
  } else if (q.type === 'text') {
    const cleanUser = userAns.replace(/\s+/g, '').toLowerCase();
    isCorrect = q.answers.some(a => a.replace(/\s+/g, '').toLowerCase() === cleanUser);
  }

  const feedbackBox = document.getElementById('feedback-box');
  const feedbackTitle = document.getElementById('feedback-title');
  const feedbackDesc = document.getElementById('feedback-desc');

  if (isCorrect) {
    score += 5; // 20문항 * 5점 = 100점
    playCorrectSound(); // 🔔 딩동댕 멜로디 소리 재생!
    feedbackBox.className = 'feedback-box feedback-correct';
    feedbackTitle.innerHTML = '🎉 정답입니다! 딩동댕 🔔';
  } else {
    playWrongSound(); // 💥 와장창 접시 깨지는 파열음 재생!
    feedbackBox.className = 'feedback-box feedback-wrong';
    feedbackTitle.innerHTML = `❌ 아쉽습니다! 땡 (접시 와장창!) 💥`;
  }

  feedbackDesc.innerHTML = `<b>[정답 해설]</b> ${q.exp}`;
  feedbackBox.style.display = 'block';
  document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < quizData.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'block';
  document.getElementById('progress-bar').style.width = '100%';
  
  document.getElementById('result-user-info').innerText = currentUser.isAdmin 
    ? `👑 관리자: 변귀섭 (2500)`
    : `도전자: ${currentUser.name} (${currentUser.id})`;
    
  document.getElementById('final-score').innerText = score;
  const msg = document.getElementById('result-msg');
  
  if (score >= 90) {
    playCorrectSound();
    msg.innerHTML = `🏆 <b>축하합니다, ${currentUser.name}!</b><br>골든벨을 완벽하게 울렸습니다! 8월 31일 실전에서도 만점 확정입니다!`;
    msg.style.color = "#34d399";
  } else if (score >= 70) {
    msg.innerHTML = `👏 <b>우수한 성적입니다, ${currentUser.name}!</b><br>틀린 문제 해설을 한 번 더 복습하고 실전에 도전하세요!`;
    msg.style.color = "#fbbf24";
  } else {
    msg.innerHTML = `💪 <b>${currentUser.name}, 조금만 더 연습해 보세요!</b><br>아래 다시 풀기 버튼을 눌러 핵심 개념을 완벽히 마스터하세요.`;
    msg.style.color = "#f87171";
  }
}

function restartQuiz() {
  initQuiz();
}
</script>
